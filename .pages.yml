# Pages CMS configuration: defines what staff can edit in the form editor.
# Edits are saved as commits to this repository; GitHub Pages then republishes the site.
media:
  input: data/media
  output: data/media
  extensions: [jpg, jpeg, png, webp, pdf]
  categories: [image, document]

content:
  - name: events
    label: Events
    type: file
    path: data/events.json
    fields:
      - name: events
        label: Events
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: date
            label: Date
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: time
            label: Time (as people should read it, e.g. 4:00 PM)
            type: string
          - name: note
            label: Short description
            type: text
          - name: url
            label: Church Center link (opens when someone taps the flyer)
            type: string
          - name: img
            label: Flyer image
            type: image
          - name: alt
            label: Flyer description for screen readers
            type: string

  - name: series
    label: Sermon series buttons
    type: file
    path: data/series.json
    fields:
      - name: series
        label: Series
        type: object
        list: true
        fields:
          - name: title
            label: Button text
            type: string
            required: true
          - name: url
            label: Link (starts with https://)
            type: string
            required: true
          - name: highlight
            label: Make this button stand out (use for Spotify)
            type: boolean
      - name: note
        label: Line under the buttons (for example, what series is running now)
        type: string

  - name: ministries
    label: Ministries
    type: file
    path: data/ministries.json
    fields:
      - name: ministries
        label: Ministries
        type: object
        list: true
        fields:
          - name: when
            label: When (for example, Wednesdays · 6:00–7:30 PM)
            type: string
            required: true
          - name: title
            label: Ministry name
            type: string
            required: true
          - name: description
            label: Description
            type: text
            required: true

  - name: site
    label: Service times, address and phone
    type: file
    path: data/site.json
    fields:
      - name: sunday_time
        label: Sunday worship time (for example, 10:45 AM)
        type: string
        required: true
      - name: wednesday_time
        label: Wednesday night time (for example, 6:00–7:30 PM)
        type: string
        required: true
      - name: monday_time
        label: Monday small group time (for example, 6:00 PM)
        type: string
        required: true
      - name: street
        label: Street address
        type: string
        required: true
      - name: city
        label: City
        type: string
        required: true
      - name: state
        label: State
        type: string
        required: true
      - name: zip
        label: ZIP code
        type: string
        required: true
      - name: phone
        label: Phone number (10 digits, like 430.808.2655)
        type: string
        required: true

  - name: people
    label: Staff and elders
    type: file
    path: data/people.json
    fields:
      - name: staff
        label: Staff
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: title
            label: Title
            type: string
          - name: photo
            label: Photo (optional; shows initials if blank)
            type: image
      - name: elders
        label: Elders
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: title
            label: Title
            type: string
          - name: photo
            label: Photo (optional). Photos only show once EVERY elder has one. An elder who is also on staff reuses their staff photo.
            type: image
      - name: elders_group_photo
        label: Elders group photo (optional; shows above the elders)
        type: image

  - name: grow
    label: Grow page (sermon quotes and newsletter)
    type: file
    path: data/grow.json
    fields:
      - name: intro
        label: Line under the page title
        type: string
      - name: quotes
        label: Sermon quotes (newest date shows biggest; the page appears once there is at least one item anywhere on it)
        type: object
        list: true
        fields:
          - name: quote
            label: Quote (the words only, no quotation marks needed)
            type: text
            required: true
          - name: sermon
            label: Sermon title
            type: string
          - name: passage
            label: Passage (for example, Romans 12:9-21)
            type: string
          - name: date
            label: Date preached
            type: date
            options:
              format: yyyy-MM-dd
          - name: url
            label: Link to watch (optional, starts with https://)
            type: string
      - name: weeks
        label: Weekly growth plan (newest date shows at the top; older weeks go into "Past weeks")
        type: object
        list: true
        fields:
          - name: date
            label: Sunday it was preached
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: sermon
            label: Sermon title
            type: string
          - name: passage
            label: Passage
            type: string
          - name: watch_url
            label: Link to watch the sermon (starts with https://)
            type: string
          - name: step
            label: Your step this week (one concrete thing, in Josh's words)
            type: text
          - name: quote
            label: Quote that goes with the step
            type: text
          - name: reflection_scripture
            label: Passages to read this week (separate with a semicolon)
            type: string
          - name: devotionals
            label: Five devotionals (Monday first; each day gets its own link on the page)
            type: object
            list: true
            fields:
              - {name: day, label: Day, type: string}
              - {name: title, label: Title, type: string}
              - {name: scripture, label: Scripture reference, type: string}
              - {name: scripture_text, label: Scripture text, type: text}
              - {name: reflection, label: Reflection (blank line between paragraphs), type: text}
              - {name: question, label: Question, type: text}
              - {name: prayer, label: Prayer, type: text}
          - name: opening_question
            label: Group opening question
            type: text
          - name: questions
            label: Discussion questions
            type: string
            list: true
      - name: newsletters
        label: Monthly newsletters (newest date shows first)
        type: object
        list: true
        fields:
          - name: date
            label: Issue date (use the 1st of the month)
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: title
            label: Title (optional; blank shows "December 2026 newsletter")
            type: string
          - name: summary
            label: One or two sentences about this issue
            type: text
          - name: file
            label: PDF file
            type: file
            options:
              extensions: [pdf]
              rename: safe
      - name: discussion
        label: Discussion questions link (optional)
        type: object
        fields:
          - name: title
            label: Title
            type: string
          - name: description
            label: One sentence
            type: string
          - name: url
            label: Link (starts with https://; leave blank to hide)
            type: string
