# Pages CMS configuration: defines what staff can edit in the form editor.
# Edits are saved as commits to this repository; GitHub Pages then republishes the site.
media:
  input: data/media
  output: data/media
  extensions: [jpg, jpeg, png, webp]
  categories: [image]

content:
  - name: events
    label: Events
    type: file
    path: data/events.json
    fields:
      - name: events
        label: Events
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: date
            label: Date
            type: date
            required: true
            options:
              format: yyyy-MM-dd
          - name: time
            label: Time (as people should read it, e.g. 4:00 PM)
            type: string
          - name: note
            label: Short description
            type: text
          - name: url
            label: Church Center link (opens when someone taps the flyer)
            type: string
          - name: img
            label: Flyer image
            type: image
          - name: alt
            label: Flyer description for screen readers
            type: string

  - name: series
    label: Sermon series buttons
    type: file
    path: data/series.json
    fields:
      - name: series
        label: Series
        type: object
        list: true
        fields:
          - name: title
            label: Button text
            type: string
            required: true
          - name: url
            label: Link (starts with https://)
            type: string
            required: true
          - name: highlight
            label: Make this button stand out (use for Spotify)
            type: boolean
      - name: note
        label: Line under the buttons (for example, what series is running now)
        type: string

  - name: ministries
    label: Ministries
    type: file
    path: data/ministries.json
    fields:
      - name: ministries
        label: Ministries
        type: object
        list: true
        fields:
          - name: when
            label: When (for example, Wednesdays · 6:00–7:30 PM)
            type: string
            required: true
          - name: title
            label: Ministry name
            type: string
            required: true
          - name: description
            label: Description
            type: text
            required: true
