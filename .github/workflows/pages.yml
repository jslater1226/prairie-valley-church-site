name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the editable data is valid JSON
        run: python3 -c "import json; [json.load(open('data/'+f)) for f in ('events.json','series.json','ministries.json','site.json','people.json')]; print('data json ok')"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the site from the template and data
        run: |
          pip install pillow
          cd build && python3 make.py
      - name: Add editable data to the published site
        run: mkdir -p dist && cp -r data dist/data
      - name: Strip location data from uploaded photos and shrink them
        run: cd build && python3 strip_media.py ../dist/data/media
      - name: Check the build produced a page
        run: test -s dist/index.html && grep -q 'id="minList"' dist/index.html && echo build ok
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Try the deploy once more if it failed
        id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
